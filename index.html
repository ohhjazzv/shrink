<body bgcolor=0 text=white style="font:16px monospace;padding:14px"><h3>shrink: what to study, what to skip</h3>minutes <input id=m type=number value=240><br><textarea id=t rows=9 cols=32></textarea><br><button onclick=go()>plan</button><pre id=o></pre><canvas id=c width=320></canvas><script>t.value='Chem Ch1,7,40\nChem Ch2,6,35\nChem Ch3,6,45\nBio Ch5,8,60\nBio Ch6,6,40\nBio Ch7,5,40\nPhysics Ch9,7,50\nPhysics Ch10,6,45\nPhysics Ch12,8,55';function go(){var l=+m.value,s='STUDY\n',k='SKIP\n',g=0,y=0,a=t.value.split('\n').map(r=>r.split(',')).filter(r=>r[2]>0).sort((p,q)=>q[1]/q[2]-p[1]/p[2]);c.height=a.length*22;var x=c.getContext('2d');x.font='14px monospace';a.map(r=>{var ok=+r[2]<=l;if(ok){l-=r[2];g+=+r[1];s+=r[0]+' '+r[1]+'m/'+r[2]+'min\n'}else k+=r[0]+' -'+r[1]+' marks\n';x.fillStyle=ok?'gold':'gray';x.fillRect(0,y,Math.min(320,r[1]/r[2]*1200),20);x.fillStyle=ok?'black':'white';x.fillText(r[0],4,y+15);y+=22});o.textContent=s+'\n'+k+'\ngot '+g+' marks, '+l+' min spare';var A=new AudioContext,u=A.createOscillator();u.connect(A.destination);u.frequency.value=g?660:220;u.start();u.stop(A.currentTime+.15)}</script>
