<body bgcolor=0 text=white style="font:16px monospace;padding:14px"><h3>shrink: what to study, what to skip</h3>minutes <input id=m type=number value=240><br><textarea id=t rows=10 cols=32></textarea><br><button onclick=go()>plan</button><pre id=o></pre><script>t.value='Chem Ch1,7,40\nChem Ch2,6,35\nChem Ch3,6,45\nBio Ch5,8,60\nBio Ch6,6,40\nBio Ch7,5,40\nPhysics Ch9,7,50\nPhysics Ch10,6,45\nPhysics Ch12,8,55';function go(){var l=+m.value,s='STUDY\n',k='SKIP\n',g=0;t.value.split('\n').map(x=>x.split(',')).filter(x=>x[2]>0).sort((p,q)=>q[1]/q[2]-p[1]/p[2]).map(x=>{if(+x[2]<=l){l-=x[2];g+=+x[1];s+=x[0]+' '+x[1]+'m/'+x[2]+'min\n'}else k+=x[0]+' -'+x[1]+' marks\n'});o.textContent=s+'\n'+k+'\ngot '+g+' marks, '+l+' min spare'}</script>
